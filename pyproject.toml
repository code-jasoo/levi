[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "levi"
version = "0.1.0"
dependencies = [
  "nicegui",
  "pandas",
  "numpy",
  "pyarrow",
  "opencv-python-headless",
  "av",
  "pillow"
]

[project.scripts]
levi = "levi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
